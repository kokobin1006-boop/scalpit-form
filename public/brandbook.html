<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scálpit | 브랜드북</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&family=Montserrat:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    /* 레이아웃: 좌측 고정 목차 + 우측 세로 스크롤 (태블릿 가로 기준, 좁으면 상단 바로 전환)
       팔레트/폰트는 사전상담 폼(index.html)의 브랜드 토큰을 그대로 따른다 */
    :root {
      --burg: #7B1A2B;
      --burg-dark: #5A1020;
      --wine: #3A1018;
      --cream: #FAF4EE;
      --cream-mid: #F0E6DC;
      --gold: #C4A47C;
      --gold-deep: #8F6F45;
      --ink: #1C0E0E;
      --text: #2D1818;
      --muted: #6E5555;
      --line: #E2D0C4;
      --white: #FFFFFF;

      --display: 'Noto Serif KR', 'Cormorant Garamond', serif;
      --latin: 'Cormorant Garamond', 'Noto Serif KR', serif;
      --label: 'Montserrat', 'Noto Sans KR', sans-serif;
      --body: 'Noto Sans KR', 'Montserrat', sans-serif;

      --rail-w: 264px;
      --gutter: clamp(24px, 5vw, 72px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--body);
      font-size: 19px; line-height: 1.7; font-weight: 400;
      word-break: keep-all; overflow-wrap: break-word;
      background: var(--cream); color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
    :focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 3px; }
    img { max-width: 100%; display: block; }
    [hidden] { display: none !important; }

    .app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100dvh; }

    /* ── 좌측 목차 ── */
    .rail {
      position: sticky; top: 0; height: 100dvh;
      background: var(--wine); color: var(--cream);
      padding: 40px 28px 28px;
      display: flex; flex-direction: column; z-index: 50;
    }
    .rail-logo img { height: 34px; width: auto; filter: brightness(0) invert(1); }
    .rail-sub {
      font-family: var(--label); font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--gold); margin-top: 12px; white-space: nowrap;
    }
    .nav { display: flex; flex-direction: column; margin-top: 44px; }
    .nav-item {
      position: relative; padding: 16px 0 16px 20px; min-height: 64px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      color: rgba(250,244,238,.62); transition: color .25s;
    }
    .nav-item::before {
      content: ''; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -3px;
      border-radius: 50%; background: var(--gold); transform: scale(0); transition: transform .25s;
    }
    .nav-ko { display: block; font-size: 18px; font-weight: 500; line-height: 1.3; }
    .nav-en {
      display: block; font-family: var(--label); font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; margin-top: 3px; color: rgba(196,164,124,.7);
    }
    .nav-item.on { color: var(--white); }
    .nav-item.on::before { transform: scale(1); }
    .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
    .to-top {
      font-size: 14px; letter-spacing: .1em;
      color: rgba(250,244,238,.7); padding: 14px 0; min-height: 48px;
      border-top: 1px solid rgba(255,255,255,.12); width: 100%;
    }
    .draft-badge {
      font-family: var(--label); font-size: 10px; letter-spacing: 3px; font-weight: 600;
      color: var(--wine); background: var(--gold); padding: 4px 10px;
    }

    main { min-width: 0; }
    .sec { padding: 104px var(--gutter); scroll-margin-top: 0; }
    .sec-inner { max-width: 940px; margin: 0 auto; }
    .sec.alt { background: var(--cream-mid); }

    .eyebrow {
      font-family: var(--label); font-size: 12px; font-weight: 600; letter-spacing: 4px;
      text-transform: uppercase; color: var(--burg); margin-bottom: 18px;
    }
    h2 {
      font-family: var(--display); font-weight: 500; font-size: clamp(30px, 3.6vw, 42px);
      line-height: 1.32; color: var(--ink); text-wrap: balance; max-width: 22em;
    }
    .lead { margin-top: 20px; color: var(--muted); max-width: 36em; font-size: 19px; }
    .sec-head { margin-bottom: 56px; }

    /* ── 표지 ── */
    .hero {
      position: relative; overflow: hidden; background: var(--wine); color: var(--cream);
      padding: 0 var(--gutter);
    }
    .hero-inner {
      position: relative; z-index: 1; max-width: 940px; margin: 0 auto;
      padding: 56px 0 72px; min-height: 640px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .draft-banner {
      position: relative; z-index: 2; max-width: 940px; margin: 0 auto; padding-top: 24px;
      font-size: 12px; letter-spacing: .06em; color: var(--gold);
    }
    .hero .eyebrow { color: var(--gold); }
    .hero h1 {
      font-family: var(--display); font-weight: 300; line-height: 1.28;
      font-size: clamp(40px, 6vw, 72px); letter-spacing: -0.01em; max-width: 9em;
    }
    .hero h1 em { font-style: normal; font-weight: 500; color: var(--gold); }
    .hero .lead { color: rgba(250,244,238,.72); margin-top: 32px; max-width: 29em; }
    .hero-hint {
      margin-top: 56px; display: flex; align-items: center; gap: 14px;
      font-size: 14px; letter-spacing: .1em;
      color: rgba(250,244,238,.6);
    }
    .hero-hint::before { content: ''; width: 44px; height: 1px; background: var(--gold); }
    .reticle {
      position: absolute; z-index: 0; right: -140px; top: 50%; width: 640px; height: 640px;
      margin-top: -320px; pointer-events: none;
    }
    @media (max-width: 1280px) { .reticle { opacity: .55; right: -220px; } }

    /* ── 브랜드 ── */
    .principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; }
    .principle { border-top: 1px solid var(--burg); padding-top: 24px; }
    .principle .p-en { font-family: var(--latin); font-style: italic; font-size: 24px; color: var(--burg); }
    .principle h3 { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.3; margin: 6px 0 14px; color: var(--ink); }
    .principle p { font-size: 17px; line-height: 1.8; color: var(--muted); }

    /* ── 방문 순서 ── */
    .journey { list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px; }
    .journey li { border-top: 1px solid var(--line); padding-top: 20px; }
    .j-no { font-variant-numeric: lining-nums; font-family: var(--latin); font-style: italic; font-size: 56px; line-height: 1; color: var(--gold-deep); }
    .journey h3 { font-size: 19px; font-weight: 700; color: var(--ink); margin: 14px 0 8px; line-height: 1.4; }
    .journey p { font-size: 16px; line-height: 1.75; color: var(--muted); }

    /* ── 프로그램 ── */
    .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .tab {
      padding: 20px 22px; min-height: 112px; background: var(--white); border: 1px solid var(--line);
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
      transition: background .25s, color .25s, border-color .25s;
    }
    .tab .t-en { font-family: var(--latin); font-style: italic; font-size: 17px; color: var(--gold-deep); letter-spacing: .02em; }
    .tab .t-ko { font-family: var(--display); font-size: 22px; font-weight: 500; line-height: 1.3; color: var(--ink); }
    .tab .t-meta { font-family: var(--label); font-size: 12px; letter-spacing: 1.5px; color: var(--muted); }
    .tab[aria-selected="true"] { background: var(--wine); border-color: var(--wine); }
    .tab[aria-selected="true"] .t-en { color: var(--gold); }
    .tab[aria-selected="true"] .t-ko { color: var(--cream); }
    .tab[aria-selected="true"] .t-meta { color: rgba(250,244,238,.65); }

    .panel { margin-top: 28px; background: var(--white); border: 1px solid var(--line); padding: 52px clamp(24px, 4vw, 56px); animation: rise .35s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p-head { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 48px; align-items: start; }
    .p-en { font-family: var(--latin); font-style: italic; font-size: 22px; color: var(--gold-deep); }
    .p-name { font-family: var(--display); font-weight: 500; font-size: clamp(34px, 4.2vw, 48px); line-height: 1.2; color: var(--ink); margin: 4px 0 8px; }
    .p-tag { font-family: var(--display); font-size: 22px; color: var(--burg); line-height: 1.5; }
    .p-sum { margin-top: 18px; color: var(--muted); font-size: 18px; line-height: 1.85; max-width: 32em; }

    .mini-label {
      font-size: 13px; font-weight: 700; letter-spacing: .1em;
      color: var(--muted); margin-bottom: 14px;
    }
    .meter { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
    .meter-row { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 12px; font-size: 15px; color: var(--text); }
    .meter-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .meter-bar i { height: 8px; background: var(--cream-mid); }
    .meter-bar i.f { background: var(--burg); }

    .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; margin: 40px 0; padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .fact-v { font-family: var(--display); font-size: 24px; line-height: 1.4; color: var(--ink); }
    .fact-v b { font-weight: 500; font-variant-numeric: tabular-nums; }

    .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; }
    .list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .list li { position: relative; padding-left: 22px; font-size: 17px; line-height: 1.7; }
    .list li::before { content: ''; position: absolute; left: 0; top: .72em; width: 8px; height: 1px; background: var(--burg); }

    .proto { margin-top: 56px; }
    .proto-top { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .legend i { width: 14px; height: 14px; display: block; }
    .legend b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
    .k-diag { background: var(--cream-mid); }
    .k-device { background: var(--burg); }
    .k-hand { background: var(--gold); }
    .bar { display: flex; gap: 3px; height: 52px; }
    .seg {
      flex-basis: 0; min-width: 0; display: flex; align-items: center; justify-content: center;
      font-family: var(--label); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .seg.k-diag { color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
    .seg.k-device { color: var(--cream); }
    .seg.k-hand { color: var(--wine); }
    .seg.on { outline: 2px solid var(--ink); outline-offset: 2px; }
    .bar-scale { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--label); font-size: 11px; letter-spacing: 1px; color: var(--muted); }

    .steps { list-style: none; margin-top: 28px; }
    .step {
      display: grid; grid-template-columns: 44px minmax(0, 1fr) 72px; gap: 8px 20px; align-items: start;
      padding: 20px 14px; margin: 0 -14px; border-top: 1px solid var(--line); transition: background .25s;
    }
    .step:last-child { border-bottom: 1px solid var(--line); }
    .step.on { background: var(--cream); }
    .s-no { font-variant-numeric: lining-nums; font-family: var(--latin); font-style: italic; font-size: 30px; line-height: 1.1; color: var(--gold-deep); }
    .s-name { font-weight: 700; font-size: 18px; color: var(--ink); line-height: 1.4; }
    .s-text { font-size: 16px; line-height: 1.75; color: var(--muted); margin-top: 4px; }
    .s-min { font-family: var(--label); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); text-align: right; padding-top: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      font-size: 13px; line-height: 1; padding: 7px 10px; border: 1px solid var(--line);
      color: var(--text); background: var(--white); white-space: nowrap;
    }
    .step .chip { background: var(--cream-mid); border-color: transparent; }
    .step.on .chip { background: var(--cream-mid); }
    .p-used { margin-top: 40px; }
    .p-used .chips { margin-top: 0; gap: 8px; }
    .p-used .chip { font-size: 15px; padding: 11px 14px; min-height: 44px; display: inline-flex; align-items: center; }
    .note { margin-top: 40px; padding: 20px 24px; background: var(--cream); font-size: 16px; line-height: 1.8; color: var(--text); display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; }
    .note .mini-label { margin: 3px 0 0; color: var(--burg); }

    /* ── 기기 ── */
    .devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
    .dev { background: var(--white); border: 1px solid var(--line); padding: 30px 28px 26px; display: flex; flex-direction: column; }
    .dev-en { font-family: var(--label); font-size: 10px; font-weight: 600; letter-spacing: 3px; color: var(--gold-deep); text-transform: uppercase; }
    .dev h3 { font-family: var(--display); font-weight: 500; font-size: 23px; line-height: 1.35; margin: 8px 0 4px; color: var(--ink); }
    .dev-role { color: var(--burg); font-size: 16px; font-weight: 500; line-height: 1.5; }
    .dev-how { margin-top: 14px; font-size: 16px; line-height: 1.8; color: var(--muted); }
    .dev-feel { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.7; color: var(--text); }
    .dev-feel b { display: block; font-size: 12px; letter-spacing: .1em; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .dev-used { margin-top: auto; padding-top: 20px; }
    .dev-used .mini-label { margin-bottom: 8px; }
    .dev-used .chips { margin-top: 0; }
    .chip-btn { cursor: pointer; transition: border-color .2s, color .2s; }
    .chip-btn:hover { border-color: var(--burg); color: var(--burg); }

    /* ── 두피 고민 ── */
    .concerns { display: flex; flex-wrap: wrap; gap: 10px; }
    .concern {
      min-height: 60px; padding: 0 26px; background: var(--white); border: 1px solid var(--line);
      font-size: 18px; display: inline-flex; align-items: center; gap: 12px; transition: all .2s;
    }
    .concern::before { content: ''; width: 14px; height: 14px; border: 1px solid var(--muted); border-radius: 50%; flex-shrink: 0; transition: all .2s; }
    .concern[aria-pressed="true"] { background: var(--burg); border-color: var(--burg); color: var(--white); font-weight: 500; }
    .concern[aria-pressed="true"]::before { background: var(--gold); border-color: var(--gold); }
    .results { margin-top: 40px; display: grid; gap: 12px; }
    .empty { padding: 36px; border: 1px dashed var(--gold); color: var(--muted); text-align: center; font-size: 17px; }
    .res {
      display: grid; grid-template-columns: 148px minmax(0, 1fr) auto; gap: 8px 32px; align-items: center;
      padding: 28px 32px; background: var(--white); border: 1px solid var(--line); animation: rise .3s ease;
    }
    .res.first { border-color: var(--burg); }
    .res-rank { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
    .res.first .res-rank { color: var(--burg); }
    .res h3 { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.3; color: var(--ink); }
    .res p { font-size: 16px; color: var(--muted); margin-top: 2px; }
    .res .chips { margin-top: 10px; }
    .res-go { font-size: 15px; letter-spacing: .04em; font-weight: 700; color: var(--burg); padding: 16px 0 16px 8px; min-height: 52px; white-space: nowrap; }
    .res-go::after { content: ' →'; }
    .medical { margin-top: 12px; padding: 20px 24px; border-left: 2px solid var(--burg); background: var(--white); font-size: 16px; color: var(--text); line-height: 1.8; }

    /* ── 홈케어 · FAQ ── */
    .tips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
    .tip { border-top: 1px solid var(--burg); padding-top: 22px; }
    .tip-big { font-family: var(--display); font-weight: 300; font-size: 34px; line-height: 1.2; color: var(--burg); font-variant-numeric: tabular-nums; }
    .tip h3 { font-size: 18px; font-weight: 700; margin: 12px 0 8px; color: var(--ink); }
    .tip p { font-size: 16px; line-height: 1.75; color: var(--muted); }
    .faq-wrap { margin-top: 88px; }
    .faq-wrap h3.faq-title { font-family: var(--display); font-weight: 500; font-size: 28px; color: var(--ink); margin-bottom: 20px; }
    details { border-bottom: 1px solid var(--line); }
    details:first-of-type { border-top: 1px solid var(--line); }
    summary {
      list-style: none; cursor: pointer; padding: 24px 56px 24px 0; position: relative; min-height: 64px;
      font-size: 19px; font-weight: 500; color: var(--ink); line-height: 1.5;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after, summary::before { content: ''; position: absolute; right: 8px; top: 50%; width: 16px; height: 1px; background: var(--burg); transition: transform .25s; }
    summary::before { transform: rotate(90deg); }
    details[open] summary::before { transform: rotate(0deg); }
    details p { padding: 0 56px 28px 0; color: var(--muted); font-size: 17px; line-height: 1.85; max-width: 40em; }

    /* ── 푸터 ── */
    footer { background: var(--wine); color: var(--cream); padding: 72px var(--gutter) 88px; }
    .foot-inner { max-width: 940px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px 64px; align-items: start; }
    .foot-logo img { height: 30px; width: auto; filter: brightness(0) invert(1); }
    .foot-tag { font-family: var(--label); font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-top: 10px; }
    .foot-disc { font-size: 14px; line-height: 1.9; color: rgba(250,244,238,.6); max-width: 38em; }

    /* ── 반응형 ── */
    @media (max-width: 1100px) {
      .journey { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 28px; }
      .tips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .principles { gap: 28px; }
    }
    @media (max-width: 1000px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .rail {
        height: auto; flex-direction: row; align-items: center; gap: 20px;
        padding: 10px 16px; overflow: hidden;
      }
      .rail-logo img { height: 24px; }
      .rail-sub, .rail-foot, .nav-en { display: none; }
      .nav { flex-direction: row; margin: 0; overflow-x: auto; scrollbar-width: none; flex: 1; }
      .nav::-webkit-scrollbar { display: none; }
      .nav-item { white-space: nowrap; padding: 12px 14px; min-height: 48px; border: 0; }
      .nav-item::before { left: 50%; top: auto; bottom: 4px; margin: 0 0 0 -3px; }
      .nav-ko { font-size: 16px; }
      .sec { padding-block: 72px; scroll-margin-top: 60px; }
      .hero-inner { min-height: 520px; }
      .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .p-head { grid-template-columns: 1fr; gap: 28px; }
      .meter { max-width: 340px; }
    }
    @media (max-width: 760px) {
      body { font-size: 17px; }
      .principles, .cols { grid-template-columns: 1fr; gap: 32px; }
      .facts { grid-template-columns: 1fr; gap: 20px; }
      .journey, .tips { grid-template-columns: 1fr; }
      .panel { padding: 36px 20px; }
      .step { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 6px 12px; }
      .s-no { font-size: 24px; }
      .res { grid-template-columns: 1fr; gap: 10px; padding: 24px 20px; }
      .res-go { padding-left: 0; }
      .reticle { opacity: .3; right: -300px; }
      .foot-inner { grid-template-columns: 1fr; }
      .concern { min-height: 56px; padding: 0 20px; font-size: 17px; }
      summary { font-size: 17px; }
      .note { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="목차">
    <button class="rail-logo" id="logoBtn" aria-label="처음으로"><img src="scalpit-logo.png" alt="Scálpit" /></button>
    <div class="rail-sub">Head Spa &amp; Scalp Care</div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <span class="draft-badge" id="draftBadge" hidden>DRAFT</span>
      <button class="to-top" id="toTop"></button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<script src="brandbook-content.js"></script>
<script>
(function () {
  const C = window.BRANDBOOK;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const devById = Object.fromEntries(C.devices.map(d => [d.id, d]));
  const progById = Object.fromEntries(C.programs.map(p => [p.id, p]));
  const state = { program: C.programs[0].id, concerns: new Set() };
  const total = p => p.steps.reduce((n, s) => n + s.min, 0);
  const programDevices = p => [...new Set(p.steps.flatMap(s => s.devices))];

  /* 표지의 현미경 시야 링: 눈금, 십자선, 모발 가닥, 스케일 바 */
  function reticleSVG() {
    const c = 320, R = 300;
    let ticks = '';
    for (let i = 0; i < 72; i++) {
      const a = (i * 5 - 90) * Math.PI / 180;
      const len = i % 6 === 0 ? 22 : i % 2 === 0 ? 12 : 7;
      const x1 = c + Math.cos(a) * R, y1 = c + Math.sin(a) * R;
      const x2 = c + Math.cos(a) * (R - len), y2 = c + Math.sin(a) * (R - len);
      ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    }
    return `<svg class="reticle" viewBox="0 0 640 640" aria-hidden="true" fill="none">
      <defs><clipPath id="rc"><circle cx="${c}" cy="${c}" r="${R - 30}"/></clipPath></defs>
      <g stroke="#C4A47C" stroke-width="1" opacity=".55">
        <circle cx="${c}" cy="${c}" r="${R}"/>
        <circle cx="${c}" cy="${c}" r="${R - 78}" opacity=".5"/>
        <circle cx="${c}" cy="${c}" r="${R - 170}" opacity=".35"/>
        <g stroke-width="1.2">${ticks}</g>
        <path d="M${c} ${c - R + 60}V${c - 14}M${c} ${c + 14}V${c + R - 60}M${c - R + 60} ${c}H${c - 14}M${c + 14} ${c}H${c + R - 60}" opacity=".5"/>
      </g>
      <g clip-path="url(#rc)" stroke="#C4A47C" stroke-linecap="round">
        <path d="M60 520C150 440 200 470 280 360S420 250 470 130 560 40 600 20" stroke-width="2.4" opacity=".5"/>
        <path d="M120 600C190 520 260 540 330 440S470 330 520 240 600 160 640 120" stroke-width="1.6" opacity=".32"/>
        <path d="M10 400C90 340 150 360 210 290S330 190 380 110" stroke-width="1.6" opacity=".3"/>
        <circle cx="322" cy="372" r="9" stroke-width="1.2" opacity=".5"/>
        <circle cx="322" cy="372" r="3" fill="#C4A47C" opacity=".6"/>
        <circle cx="402" cy="296" r="7" stroke-width="1.2" opacity=".4"/>
        <circle cx="268" cy="452" r="6" stroke-width="1.2" opacity=".35"/>
      </g>
      <g stroke="#C4A47C" opacity=".75">
        <path d="M232 560H408M232 553V567M408 553V567"/>
      </g>
      <g fill="#C4A47C" font-family="Montserrat, sans-serif" font-size="12" letter-spacing="3" opacity=".8">
        <text x="320" y="588" text-anchor="middle">100 µm</text>
        <text x="320" y="76" text-anchor="middle">× 200</text>
      </g>
    </svg>`;
  }

  /* ── 섹션 렌더 ── */
  function secHead(d) {
    return `<div class="sec-head"><div class="eyebrow">${esc(d.eyebrow)}</div><h2>${esc(d.title)}</h2><p class="lead">${esc(d.lead)}</p></div>`;
  }

  function renderHero() {
    const h = C.hero;
    return `<section class="hero" id="top">
      ${C.meta.draft ? `<div class="draft-banner">${esc(C.ui.draftBanner)}</div>` : ''}
      ${reticleSVG()}
      <div class="hero-inner">
        <div class="eyebrow">${esc(h.eyebrow)}</div>
        <h1>${h.title.map((t, i) => (i ? '<br />' : '') + t).join('')}</h1>
        <p class="lead">${esc(h.lead)}</p>
        <div class="hero-hint">${esc(h.hint)}</div>
      </div>
    </section>`;
  }

  function renderBrand() {
    const b = C.brand;
    return `<section class="sec" id="brand"><div class="sec-inner">
      ${secHead(b)}
      <div class="principles">${b.principles.map(p => `
        <div class="principle"><div class="p-en">${esc(p.en)}</div><h3>${esc(p.ko)}</h3><p>${esc(p.text)}</p></div>`).join('')}
      </div></div></section>`;
  }

  function renderJourney() {
    const j = C.journey;
    return `<section class="sec alt" id="journey"><div class="sec-inner">
      ${secHead(j)}
      <ol class="journey">${j.steps.map((s, i) => `
        <li><div class="j-no">${i + 1}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></li>`).join('')}
      </ol></div></section>`;
  }

  function renderProgramsShell() {
    return `<section class="sec" id="programs"><div class="sec-inner">
      ${secHead(C.programsSection)}
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="panel" id="panel" role="tabpanel"></div>
    </div></section>`;
  }

  function renderTabs() {
    $('#tabs').innerHTML = C.programs.map(p => `
      <button class="tab" role="tab" data-prog="${p.id}" aria-selected="${p.id === state.program}">
        <span class="t-en">${esc(p.en)}</span>
        <span class="t-ko">${esc(p.ko)}</span>
        <span class="t-meta">${total(p)}${esc(C.programsSection.labels.minute)}</span>
      </button>`).join('');
  }

  function renderPanel() {
    const p = progById[state.program], L = C.programsSection.labels;
    const mins = total(p);
    const byKind = Object.fromEntries(Object.keys(C.kinds).map(k => [k, p.steps.filter(s => s.kind === k).reduce((n, s) => n + s.min, 0)]));
    $('#panel').innerHTML = `
      <div class="p-head">
        <div>
          <div class="p-en">${esc(p.en)}</div>
          <h3 class="p-name">${esc(p.ko)}</h3>
          <div class="p-tag">${esc(p.tagline)}</div>
          <p class="p-sum">${esc(p.summary)}</p>
        </div>
        <div>
          <div class="mini-label">${esc(L.focus)}</div>
          <div class="meter">${C.focusAxes.map(a => `
            <div class="meter-row"><span>${esc(a.label)}</span>
              <span class="meter-bar" role="img" aria-label="${esc(a.label)} ${p.focus[a.key]} / 5">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= p.focus[a.key] ? 'f' : ''}"></i>`).join('')}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>

      <div class="facts">
        <div><div class="mini-label">${esc(L.time)}</div><div class="fact-v">약 <b>${mins}</b>${esc(L.minute)}</div></div>
        <div><div class="mini-label">${esc(L.cycle)}</div><div class="fact-v">${esc(p.cycle)}</div></div>
      </div>

      <div class="cols">
        <div><div class="mini-label">${esc(L.forWho)}</div><ul class="list">${p.forWho.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        <div><div class="mini-label">${esc(L.effects)}</div><ul class="list">${p.effects.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      </div>

      <div class="proto">
        <div class="proto-top">
          <div class="mini-label" style="margin:0">${esc(L.protocol)}</div>
          <div class="legend">${Object.entries(C.kinds).filter(([k]) => byKind[k]).map(([k, label]) =>
            `<span><i class="k-${k}"></i>${esc(label)} <b>${byKind[k]}${esc(L.minute)}</b></span>`).join('')}</div>
        </div>
        <div class="bar" id="bar">${p.steps.map((s, i) =>
          `<button class="seg k-${s.kind}" style="flex-grow:${s.min}" data-step="${i}" aria-label="${i + 1}. ${esc(s.name)} ${s.min}${esc(L.minute)}">${i + 1}</button>`).join('')}</div>
        <div class="bar-scale"><span>0</span><span>${mins}${esc(L.minute)}</span></div>
        <ol class="steps">${p.steps.map((s, i) => `
          <li class="step" data-step="${i}">
            <div class="s-no">${i + 1}</div>
            <div>
              <div class="s-name">${esc(s.name)}</div>
              <div class="s-text">${esc(s.text)}</div>
              ${s.devices.length ? `<div class="chips">${s.devices.map(d => `<span class="chip">${esc(devById[d].name)}</span>`).join('')}</div>` : ''}
            </div>
            <div class="s-min">${s.min}${esc(L.minute)}</div>
          </li>`).join('')}
        </ol>
      </div>

      <div class="p-used">
        <div class="mini-label">${esc(L.devices)}</div>
        <div class="chips">${programDevices(p).map(d => `<button class="chip chip-btn" data-go-device="${d}">${esc(devById[d].name)}</button>`).join('')}</div>
      </div>

      ${p.note ? `<div class="note"><div class="mini-label">${esc(L.note)}</div><div>${esc(p.note)}</div></div>` : ''}`;
  }

  function renderDevices() {
    const D = C.devicesSection;
    return `<section class="sec alt" id="devices"><div class="sec-inner">
      ${secHead(D)}
      <div class="devices">${C.devices.map(d => {
        const used = C.programs.filter(p => programDevices(p).includes(d.id));
        return `<article class="dev" id="dev-${d.id}">
          <div class="dev-en">${esc(d.en)}</div>
          <h3>${esc(d.name)}</h3>
          <div class="dev-role">${esc(d.role)}</div>
          <p class="dev-how">${esc(d.how)}</p>
          <div class="dev-feel"><b>${esc(D.labels.feel)}</b>${esc(d.feel)}</div>
          <div class="dev-used"><div class="mini-label">${esc(D.labels.usedIn)}</div>
            <div class="chips">${used.map(p => `<button class="chip chip-btn" data-go-prog="${p.id}">${esc(p.ko)}</button>`).join('')}</div>
          </div>
        </article>`;
      }).join('')}</div></div></section>`;
  }

  function renderFinderShell() {
    const F = C.finderSection;
    return `<section class="sec" id="finder"><div class="sec-inner">
      ${secHead(F)}
      <div class="concerns" id="concerns">${C.concerns.map(c =>
        `<button class="concern" data-concern="${c.id}" aria-pressed="false">${esc(c.ko)}</button>`).join('')}</div>
      <div class="results" id="results"></div>
    </div></section>`;
  }

  function renderResults() {
    const F = C.finderSection;
    $$('.concern').forEach(b => b.setAttribute('aria-pressed', state.concerns.has(b.dataset.concern)));
    const picked = C.concerns.filter(c => state.concerns.has(c.id));
    if (!picked.length) { $('#results').innerHTML = `<div class="empty">${esc(F.empty)}</div>`; return; }
    const score = {};
    picked.forEach(c => c.programs.forEach((pid, i) => { score[pid] = (score[pid] || 0) + (i === 0 ? 2 : 1); }));
    const ranked = C.programs.filter(p => score[p.id]).sort((a, b) => score[b.id] - score[a.id]);
    const best = score[ranked[0].id];
    $('#results').innerHTML = ranked.map(p => `
      <div class="res ${score[p.id] === best ? 'first' : ''}">
        <div class="res-rank">${esc(score[p.id] === best ? F.primary : F.secondary)}</div>
        <div>
          <h3>${esc(p.ko)}</h3><p>${esc(p.tagline)}</p>
          <div class="chips">${picked.filter(c => c.programs.includes(p.id)).map(c => `<span class="chip">${esc(c.ko)}</span>`).join('')}</div>
        </div>
        <button class="res-go" data-go-prog="${p.id}">${esc(F.more)}</button>
      </div>`).join('') + (picked.some(c => c.medical) ? `<div class="medical">${esc(F.medical)}</div>` : '');
  }

  function renderCare() {
    const S = C.careSection;
    return `<section class="sec alt" id="care"><div class="sec-inner">
      ${secHead(S)}
      <div class="tips">${C.homecare.map(t => `
        <div class="tip"><div class="tip-big">${esc(t.big)}</div><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></div>`).join('')}</div>
      <div class="faq-wrap">
        <h3 class="faq-title">${esc(S.faqTitle)}</h3>
        ${C.faq.map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}
      </div></div></section>`;
  }

  function renderFooter() {
    return `<footer><div class="foot-inner">
      <div><div class="foot-logo"><img src="scalpit-logo.png" alt="Scálpit" /></div><div class="foot-tag">${esc(C.footer.tagline)}</div></div>
      <p class="foot-disc">${esc(C.footer.disclaimer)}</p>
    </div></footer>`;
  }

  /* ── 조립 ── */
  $('#main').innerHTML = renderHero() + renderBrand() + renderJourney() + renderProgramsShell() + renderDevices() + renderFinderShell() + renderCare() + renderFooter();
  $('#nav').innerHTML = C.nav.map(n => `<button class="nav-item" data-nav="${n.id}"><span class="nav-ko">${esc(n.ko)}</span><span class="nav-en">${esc(n.en)}</span></button>`).join('');
  $('#toTop').textContent = C.ui.toTop;
  if (C.meta.draft) $('#draftBadge').hidden = false;
  renderTabs(); renderPanel(); renderResults();

  /* ── 동작 ── */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const go = id => document.getElementById(id).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  const selectProgram = id => { state.program = id; renderTabs(); renderPanel(); };

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.nav) return go(t.dataset.nav);
    if (t.id === 'toTop' || t.id === 'logoBtn') return go('top');
    if (t.dataset.prog) return selectProgram(t.dataset.prog);
    if (t.dataset.goProg) { selectProgram(t.dataset.goProg); return go('programs'); }
    if (t.dataset.goDevice) return go('dev-' + t.dataset.goDevice);
    if (t.dataset.concern) {
      state.concerns.has(t.dataset.concern) ? state.concerns.delete(t.dataset.concern) : state.concerns.add(t.dataset.concern);
      return renderResults();
    }
    if (t.classList.contains('seg')) {
      const on = t.classList.contains('on');
      $$('.seg.on, .step.on').forEach(el => el.classList.remove('on'));
      if (!on) {
        t.classList.add('on');
        const row = $(`.step[data-step="${t.dataset.step}"]`); row.classList.add('on');
        row.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
      }
    }
  });

  /* 현재 위치 표시 */
  const navBtns = Object.fromEntries($$('.nav-item').map(b => [b.dataset.nav, b]));
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      Object.values(navBtns).forEach(b => b.classList.remove('on'));
      const b = navBtns[en.target.id]; if (b) { b.classList.add('on'); if (innerWidth <= 1000) b.scrollIntoView({ inline: 'center', block: 'nearest' }); }
    });
  }, { rootMargin: '-35% 0px -60% 0px' });
  C.nav.forEach(n => io.observe(document.getElementById(n.id)));
  io.observe(document.getElementById('top'));

  /* 대기석용: 일정 시간 조작이 없으면 처음 화면으로 */
  let idle;
  const dirty = () => scrollY > 40 || state.concerns.size || state.program !== C.programs[0].id;
  const arm = () => {
    clearTimeout(idle);
    idle = setTimeout(() => {
      if (!dirty()) return;
      state.concerns.clear(); selectProgram(C.programs[0].id); renderResults();
      $$('details[open]').forEach(d => d.open = false);
      scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    }, C.meta.idleSeconds * 1000);
  };
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, arm, { passive: true }));
  arm();
})();
</script>
</body>
</html>
